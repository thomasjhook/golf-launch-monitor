[package]
name = "capture-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "capture_daemon"
path = "src/lib.rs"

[[bin]]
name = "capture-daemon"
path = "src/main.rs"

[dependencies]
protocol = { workspace = true }
firmware-core = { path = "../firmware-core" }
launch-types = { workspace = true }
launch-sim = { path = "../launch-sim" }
calibration = { workspace = true }
vision = { workspace = true }
capture-store = { path = "../capture-store" }
launch-proto = { path = "../launch-proto" }
thiserror = { workspace = true }
tonic = "0.14"
tokio = { version = "1.47.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time", "io-util"] }
tokio-serial = "5.4"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }

[dev-dependencies]
shot-service = { path = "../shot-service" }
