[package]
name = "launch-monitor-firmware"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

# Standalone package: NOT part of the parent workspace (different target).
[workspace]

[dependencies]
protocol = { path = "../crates/protocol" }
firmware-core = { path = "../crates/firmware-core" }

embassy-executor = { version = "=0.10.0", features = ["defmt"] }
embassy-rp = { version = "=0.10.0", features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "binary-info", "rp235xa", "executor-thread"] }
embassy-time = { version = "=0.5.1", features = ["defmt"] }
embassy-sync = { version = "=0.8.0", features = ["defmt"] }
embassy-usb = { version = "=0.6.0", features = ["defmt"] }
embassy-futures = "=0.1.2"

defmt = "=1.0.1"
defmt-rtt = "=1.0.0"
cortex-m = { version = "=0.7.10", features = ["inline-asm"] }
cortex-m-rt = "=0.7.7"
static_cell = "=2.1.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 2
panic = "abort"

[profile.dev]
opt-level = "s"
