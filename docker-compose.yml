# Local Postgres for native development (`make db-up`). In Kubernetes the
# database is deploy/k8s/postgres.yaml instead. Credentials here are for a
# local-only dev database bound to 127.0.0.1.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: launch
      POSTGRES_PASSWORD: launch-dev
      POSTGRES_DB: launchmonitor
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U launch -d launchmonitor"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
