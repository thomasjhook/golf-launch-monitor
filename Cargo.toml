[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
thiserror = "2"
launch-types = { path = "crates/launch-types" }
protocol = { path = "crates/protocol" }
calibration = { path = "crates/calibration" }
vision = { path = "crates/vision" }
metrics = { path = "crates/metrics" }
flight-model = { path = "crates/flight-model" }

[profile.release]
lto = "thin"
codegen-units = 1
